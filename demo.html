<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoulder kit demo</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e23; color: #eee; font: 14px system-ui, sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; } #msg { position: fixed; left: 10px; top: 10px; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas><div id="msg">Loading…</div>
<script type="module">
// Smallest host page for the shoulder kit (docs/KIT.md). ?elev=90&plane=0&rot=0&view=realistic set the start pose/view.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { loadShoulder } from './js/kit.js';

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1b1e23');
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 50);
camera.position.set(-0.4, -0.05, 1.0);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, -0.15, 0); controls.update();
const q = new URLSearchParams(location.search), num = (k) => q.has(k) ? +q.get(k) : undefined;
const msg = document.getElementById('msg');

const kit = await loadShoulder({ renderer, scene, camera, view: q.get('view') || 'present',
  onProgress: (f) => { msg.textContent = 'Loading ' + Math.round(100 * f) + '%'; } });
window.kit = kit;
// example custom mesh: a 3.5 x 30 mm "screw" in the humeral head, made in file coordinates, moving with the humerus
const gh = new THREE.Vector3(...kit.center), screw = new THREE.Mesh(new THREE.CylinderGeometry(0.00175, 0.00175, 0.03, 16),
  new THREE.MeshStandardMaterial({ color: '#c0c6cc', metalness: 0.9, roughness: 0.3 }));
screw.position.copy(gh).add(new THREE.Vector3(-0.02, 0, 0)); screw.rotation.z = Math.PI / 2;
kit.addMesh(screw, { bone: 'humerus', name: 'Demo screw', layer: 'implant' });
kit.setPose({ plane: num('plane'), elev: num('elev'), rot: num('rot'), elbow: num('elbow'), sup: num('sup') });
msg.textContent = kit.names().length + ' structures · window.kit';

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); kit.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
