<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hand Anatomy VR</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e23; color: #eee;
    font: 15px system-ui, sans-serif; }
  #c3d { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: #1b1e23; z-index: 10; gap: 12px; }
  #bar { width: 60vw; max-width: 420px; height: 12px; background: #333; border-radius: 6px; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #e9c46a; transition: width .2s; }
  #top { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
  button.big { font-size: 16px; padding: 10px 16px; border: 0; border-radius: 8px; background: #2d6cdf;
    color: #fff; cursor: pointer; }
  button.big:disabled { background: #555; cursor: default; }
  #menuBtn { position: fixed; top: 10px; left: 10px; z-index: 5; }
  .panel { position: fixed; z-index: 4; border-radius: 10px; touch-action: none; }
  #menuCanvas { left: 10px; top: 60px; width: min(340px, 46vw); }
  #infoCanvas { right: 10px; bottom: 10px; width: min(340px, 46vw); }
  #credit { position: fixed; right: 8px; top: 8px; font-size: 11px; opacity: .6; z-index: 3; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="loading"><div id="loadText">Loading anatomy…</div><div id="bar"><div id="fill"></div></div></div>
<div id="top">
  <button class="big" id="vrBtn" disabled>Enter VR</button>
  <button class="big" id="arBtn" disabled>Enter MR (passthrough)</button>
</div>
<button class="big" id="menuBtn">☰ Menu</button>
<div id="credit">Z-Anatomy (CC BY-SA 4.0) · BodyParts3D © DBCLS (CC BY 4.0)</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
